<script>
// الحارس - اذا ما مسجل دخول يرجعك للوجن
if(!localStorage.getItem("userName")){
  window.location.href = "login.html";
}
</script>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي - Kafu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tahoma'}
body{background:#f5f5f5}
.topbar{background:#ffc107;text-align:center;padding:12px;font-weight:bold;font-size:18px}
.box{background:white;margin:15px;border-radius:10px;padding:20px;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.balance{color:#28a745;font-size:24px;font-weight:bold;margin:10px 0}
.btns{display:flex;gap:10px;margin:15px}
.btn{flex:1;padding:14px;border:none;border-radius:8px;font-weight:bold;font-size:16px;color:white;cursor:pointer}
.btn-green{background:#28a745}
.btn-red{background:#dc3545}
.id{color:#666;font-size:14px;margin-top:10px}
.logout{background:red;color:white;padding:8px 12px;border:none;border-radius:8px;position:fixed;top:45px;left:10px;font-size:12px;z-index:999}
</style>
</head>
<body>

<div class="topbar">حسابي</div>
<button class="logout" onclick="logout()">تسجيل خروج</button>

<div class="box">
  <p style="color:#666">رصيدك الحالي</p>
  <p class="balance">IQD <span id="balance">0</span></p>
  <p class="id">ID المستخدم: <span id="userid"></span></p>
</div>

<div class="btns">
  <button class="btn btn-red">سحب</button>
  <button class="btn btn-green">إيداع</button>
</div>

<script>
// يجيب البيانات من التخزين ويعرضها
document.getElementById('userid').innerText = localStorage.getItem("userID");
document.getElementById('balance').innerText = localStorage.getItem("balance") || "0";

// دالة تسجيل الخروج
function logout(){
  localStorage.clear();
  window.location.href = "login.html";
}
</script>

</body>
</html>
