<script>
// هذا الحارس - اذا ماكو تسجيل دخول يرجعك للوجن
if(!localStorage.getItem("userName")){
  window.location.href = "login.html";
}
</script>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Kafu</title>
</head>
<body>
<h1>اهلا بك في Kafu</h1>
<p>مرحبا <span id="user"></span></p>
<button onclick="logout()">تسجيل خروج</button>

<script>
// يطبع الاسم
document.getElementById('user').innerText = localStorage.getItem("userName");

// دالة تسجيل الخروج
function logout(){
  localStorage.clear();
  window.location.href = "login.html";
}
</script>
</body>
</html>
