 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - Kafu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#0d0d0d,#1a1a1a);color:white;font-family:'Tahoma';display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#222;padding:35px;border-radius:20px;width:90%;max-width:350px;text-align:center;border:2px solid #25d366;box-shadow:0 0 20px #25d36633}
input{width:100%;padding:14px;margin:12px 0;border:none;border-radius:10px;background:#333;color:white;font-size:15px}
input::placeholder{color:#aaa}
button{width:100%;padding:14px;background:#25d366;color:black;border:none;border-radius:10px;font-weight:bold;font-size:17px;cursor:pointer;margin-top:10px}
button:hover{background:#1ebe5a}
h2{color:#25d366;margin-bottom:20px}
</style>
</head>
<body>
<div class="box">
  <h2>🔐 تسجيل الدخول</h2>
  <input type="text" id="name" placeholder="اكتب اسمك">
  <input type="text" id="id" placeholder="اكتب الايدي">
  <input type="password" id="pass" placeholder="اكتب كلمة السر">
  <button onclick="login()">دخول</button>
</div>

<script>
function login(){
  let name = document.getElementById('name').value.trim();
  let id = document.getElementById('id').value.trim();
  let pass = document.getElementById('pass').value.trim();
  
  if(name == "" || id == "" || pass == ""){
    alert("⚠️ رجاءً املي كل الحقول");
  } else {
    localStorage.setItem("userName", name);
    localStorage.setItem("userID", id);
    window.location.href = "index.html";
  }
}
</script>
</body>
</html>
