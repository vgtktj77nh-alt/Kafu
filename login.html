<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تسجيل الدخول - Kafu</title>
<style>
body{background:#0d0d0d;color:white;font-family:tahoma;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#1a1a1a;padding:30px;border-radius:15px;width:320px;text-align:center;border:2px solid #25d366}
input{width:90%;padding:12px;margin:10px 0;border:none;border-radius:8px;background:#2a2a2a;color:white}
button{width:100%;padding:12px;background:#25d366;color:black;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer}
button:hover{background:#1ebe5a}
h2{color:#25d366}
</style>
</head>
<body>
<div class="box">
  <h2>🔐 تسجيل الدخول</h2>
  <input type="text" id="name" placeholder="الاسم">
  <input type="text" id="id" placeholder="الايدي">
  <input type="password" id="pass" placeholder="كلمة السر">
  <button onclick="login()">دخول</button>
</div>

<script>
function login(){
  let name = document.getElementById('name').value;
  let id = document.getElementById('id').value;
  let pass = document.getElementById('pass').value;
  
  if(name == "" || id == "" || pass == ""){
    alert("رجاءً املي كل الحقول");
  } else {
    // هنا نحفظ البيانات ونحول للصفحة الرئيسية
    localStorage.setItem("userName", name);
    localStorage.setItem("userID", id);
    window.location.href = "index.html";
  }
}
</script>
</body>
</html>
